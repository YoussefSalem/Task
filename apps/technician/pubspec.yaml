name: technician
description: "Task — Technician app (v1)."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Shared workspace packages
  task_core:
  task_design:
  task_domain:
  task_data:

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Formatting & persistence
  intl: any
  shared_preferences: ^2.3.2

  # Device location (broadcasting the live tracking trail while on a job)
  geolocator: ^13.0.1

  # Opening Google Maps navigation to the customer's location
  url_launcher: ^6.3.0

  # Interactive job map (native Android/iOS). Same version + API key the
  # customer app uses for its location picker; web falls back to a static map.
  google_maps_flutter: ^2.9.0

  # Firebase (App Check mandatory on all DB/API calls — PRD §1.1)
  firebase_core: ^3.6.0
  firebase_app_check: ^0.3.1
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.6.2

  # Voice calls (LiveKit, token minted by the generateCallToken function)
  livekit_client: ^2.8.1

  # Google Fonts (Cairo — shared design language)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icon generation. Sibling of the customer mark (same glossy badge,
# black background) recoloured from violet to the technician teal so the two
# apps are clearly distinguishable in the stores. Run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/task_pro_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generated: true
    background_color: "#000000"
    theme_color: "#0D9488"
